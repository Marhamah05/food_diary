      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

      }

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            while (true) {
              const { done, value } = await reader.read();

              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"e92cc533-96d6-4670-a7dd-7674e76324ff\"><\u002Fscript>\n<script src=\"6c288604-76d0-4cd0-99c9-0cc9defffdd8\"><\u002Fscript>\n< ransform-origin:left center;}\n  .shining-title-dark{display:inline-block;background:linear-gradient(100deg,var(--color-text) 30%,var(--color-accent) 49%,#D9A94A 52%,var(--color-accent) 55%,var(--color-text) 72%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shineGlow 5s linear infinite;}\n  .plainbtn{background:none;border:none;cursor:pointer;font:inherit;color:inherit;padding:0;text-align:left;}\n  .lift{transition:transform .16s ease, box-shadow .16s ease;}\n  .lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}\n  .navitem:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);}\n  .actrow:hover{box-shadow:var(--shadow-md);}\n  @media(max-width:920px){\n    [data-shell]{flex-direction:column !important;}\n    [data-sidebar]{width:100% !important;height:auto !important;position:static !important;flex-direction:row !important;align-items:center !important;padding:14px 16px !important;gap:14px !important;overflow-x:auto !important;}\n    [data-sidenav]{flex-direction:row !important;gap:6px !important;flex:1 !important;}\n    [data-sidefoot]{display:none !important;}\n    [data-navlabel]{display:none !important;}\n    [data-hero]{grid-template-columns:1fr !important;}\n    [data-weekcols]{grid-template-columns:1fr !important;}\n    [data-weekbody]{grid-template-columns:1fr !important;}\n    [data-main]{padding:22px !important;}\n    [data-topbar]{flex-wrap:wrap !important;gap:14px !important;}\n    [data-authgrid]{grid-template-columns:1fr !important;}\n    [data-authbrand]{padding:32px !important;min-height:220px !important;}\n    /* HP: gambar pasangan pindah ke bawah teks, tidak ditimpa tulisan (14 Okt 2026) */\n    [data-authbrand]{padding:26px 22px 22px !important;justify-content:flex-start !important;gap:14px;}\n    [data-authcouple]{position:relative !important;order:9;right:auto !important;bottom:auto !important;width:100% !important; Fspan>\n    <span class=\"heart\" style=\"left:42%;bottom:26%;font-size:65px;animation-delay:3.4s;color:var(--color-accent);\">♥<\u002Fspan>\n    <span class=\"heart\" style=\"left:6%;bottom:52%;font-size:45px;animation-delay:4.1s;\">♥<\u002Fspan>\n    <span class=\"heart\" style=\"left:36%;bottom:38%;font-size:58px;animation-delay:5.2s;color:var(--color-accent);\">♥<\u002Fspan>\n    <span class=\"heart\" style=\"left:16%;bottom:64%;font-size:40px;animation-delay:6.1s;\">♥<\u002Fspan>\n    <span class=\"heart\" style=\"left:48%;bottom:50%;font-size:50px;animation-delay:2.0s;\">♥<\u002Fspan>\n    <span class=\"heart\" style=\"left:26%;bottom:22%;font-size:70px;animation-delay:3.9s;color:var(--color-accent);\">♥<\u002Fspan>\n\n    <div style=\"position:relative;display:flex;align-items:center;gap:11px;\">\n      <div style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;color:var(--color-bg);font-family:var(--font-heading);font-size:22px;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--color-accent) 70%,transparent);\">S<\u002Fdiv>\n      <div><div style=\"font-family:var(--font-heading);font-size:27px;color:var(--color-accent-900);line-height:1;\">SHINING<\u002Fdiv><div style=\"font-size:13px;color:var(--color-accent-2-800);margin-top:2px;\">Sehat sebelum hamil itu penting<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;\">\n      <div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700);\">Edukasi Gizi &amp; Kesehatan Prakonsepsi<\u002Fdiv>\n      <h1 class=\"shining-title-dark\" style=\"font-size:59px;line-height:1.02;margin:10px 0 8px;letter-spacing:0.01em;\">SHINING<\u002Fh1>\n      <div style=\"font-family:var(--font-heading);font-size:25px;line-height:1.25;color:var(--color-accent-800);margin:6px 0 10px;max-width:min(420px,58%);\">Siap memulai hidup baru bersama pasangan?<\u002Fdiv>\n      <p style=\"font-size:18px;line-height:1.65;color:var(--color-accent-2-900);max-width:min(420px,58%);\">SHINING–Educatin hadir untuk Kakak/Abang yang ingin menikah — mempersiapkan kehamilan &amp; keluarga sehat, mulai dari sekarang.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;font-size:17px;line-height:1.55;color:var(--color-accent-2-900);font-style:italic;max-width:min(400px,58%);\">\"Mempersiapkan generasi yang sehat dan kuat — dimulai dari status gizi &amp; kesehatan Kakak/Abang hari ini.\"<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;justify-content:center;padding:40px;\" data-authform=\"\">\n    <sc-if value=\"{{ pesertaLama }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-kembali=\"\" style=\"width:100%;max-width:400px;animation:floatIn .4s ease both;\">\n        <div style=\"width:56px;height:56px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:26px;margin-bottom:18px;\">👋<\u002Fdiv>\n        <h2 style=\"font-size:28px;line-height:1.2;margin:0 0 8px;\">Selamat datang kembali, {{ formName }}<\u002Fh2>\n        <p style=\"font-size:15px;line-height:1.65;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:0;\">Progres belajarmu tersimpan di perangkat ini. Ketuk tombol di bawah untuk melanjutkan.<\u002Fp>\n        <button sc-camel-on-click=\"{{ lanjutkan }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:22px;\">Lanjutkan belajar →<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ gantiPeserta }}\" class=\"plainbtn\" style=\"display:block;margin:16px auto 0;background:none;border:none;cursor:pointer;font-size:13.5px;color:var(--color-accent-2-800);text-decoration:underline;\">Bukan {{ formName }}? Masuk sebagai peserta lain<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ formTampil }}\" hint-placeholder-val=\"{{ true }}\">\n    <s }}<\u002Fp>\n        <div style=\"margin-top:22px;padding:14px 16px;border-radius:var(--radius-md);background:var(--color-accent-2-100);color:var(--color-accent-2-900);font-size:13.5px;line-height:1.6;\">Sudah pernah terdaftar dan ingin melanjutkan? Hubungi kami lewat WhatsApp <strong>0813-8172-4884<\u002Fstrong> agar dibukakan aksesnya.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ regBuka }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:100%;max-width:400px;animation:floatIn .4s ease both;\">\n      <h2 style=\"font-size:30px;margin:0 0 4px;\">Masuk kelas<\u002Fh2>\n      <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0 0 24px;\">Lengkapi data Anda dan pilih asal pendaftaran — kode kelas akan otomatis diberikan.<\u002Fp>\n\n      <div class=\"field\"><label>Nama lengkap<\u002Flabel>\n        <input class=\"input\" value=\"{{ formName }}\" sc-camel-on-input=\"{{ setName }}\" placeholder=\"Nama Anda\">\n      <\u002Fdiv>\n      <div class=\"field\" style=\"margin-top:14px;\"><label>No. HP / Email<\u002Flabel>\n        <input class=\"input\" value=\"{{ formHp }}\" sc-camel-on-input=\"{{ setFormHp }}\" placeholder=\"08xx atau email\">\n      <\u002Fdiv>\n\n      <div class=\"field\" style=\"margin-top:14px;\"><label>Asal pendaftaran<\u002Flabel>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;\">\n          <sc-for list=\"{{ origins }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" class=\"plainbtn\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <details style=\"margin-top:10px;\">\n          <summary style=\"cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--color-accent-2-800);\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" f               <span class=\"{{ a.statusTagClass }}\">{{ a.statusLabel }}<\u002Fspan>\n                <sc-if value=\"{{ a.locked }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-neutral-500)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{ a.unlocked }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-neutral-400)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ showServerBanner }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-serverbanner=\"\" style=\"display:flex;align-items:flex-start;gap:14px;background:var(--color-accent-100);border-left:5px solid var(--color-accent);border-radius:var(--radius-md);padding:15px 18px;margin-top:6px;\">\n            <div style=\"flex:1;font-size:14px;line-height:1.6;\">✅ <strong style=\"color:var(--color-accent-800);\">Data awal Kakak/Abang sudah tercatat<\u002Fstrong> dari perangkat sebelumnya — kuesioner Minggu 0 <strong>tidak perlu diisi ulang<\u002Fstrong>. Silakan lanjut ke minggu yang sedang berjalan.\n              <div><button sc-camel-on-click=\"{{ resumeLearning }}\" class=\"btn btn-primary\" style=\"margin-top:10px;\">Ke minggu berjalan →<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showAksesBanner }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px;background:var(--color-accent-2-100);border:1px solid var(--color-accent-2-200);border-radius:var(--radius-lg);padding:18px 20px;margin-top:6px;\">\n            <div style=\"flex:1;\">\n              <div style=\"font-family:var(--font-heading);font-size:18px;color:var(--color-accent-2-900);\">Sebelum lanjut: Kuesioner Kemudahan dan Keterbacaan Aplikasi<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.55;color:var(--color-accent-2-800);margin-top:3px;\">5 pernyataan singkat (±2 menit, wajib) tentang kemudahan dan keterbacaan aplikasi ini.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ openAkses }}\" class=\"btn btn-primary\" style=\"margin-top:12px;\">Isi kuesioner →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ weekHasNext }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px;background:var(--color-accent-2-100);border:1px solid var(--color-accent-2-200);border-radius:var(--radius-lg);padding:18px 20px;margin-top:6px;\">\n            <div style=\"flex:1;\">\n              <sc-if value=\"{{ weekAllDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-family:var(--font-heading);font-size:18px;color:var(--color-accent-2-900);\">🎉 Semua kegiatan minggu ini selesai!<\u002Fdiv>\n                <div style=\"font-size:13.5px;line-height:1.55;color:var(--color-accent-2-800);margin-top:3px;\">Kerja bagus, Kakak/Abang sudah menuntaskan seluruh kegiatan minggu ini.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ weekNotAllDone }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-family:var(--font-heading);font-size:18px;color:var(--color-accent-2-900);\">Lanjut ke minggu berikutnya<\u002Fdiv>\n                <div style=\"font-size:13.5px;line-height:1.55;color:var(--color-accent-2-800);margin-top:3px;\">Selesaikan dulu kegiatan minggu ini ya. Minggu berikutnya terbuka sesuai jadwal.<\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ goNextWeek }}\" class=\"btn btn-primary\" style=\"margin-top:12px;\">{{ nextWeekBtn }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- RIGHT PANEL -->\n        <div data-viewer=\"\" style=\"position:sticky;top:24px;\">\n          <sc-if value=\"{{ showViewer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-lg\" style=\"padding:0;overflow:hidden;animation:floatIn .3s ease both;\">\n            <div style=\"padding:16px 20px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between;\">\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:{{ viewer.typeColor }};\">{{ viewer.typeLabel }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ closeViewer }}\" class=\"btn btn-secondary btn-icon\" aria-label=\"Tutup\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:20px;\">\n              <div class=\"card-title\" style=\"font-size:20px;margin-bottom:14px;\">{{ viewer.title }}<\u002Fdiv>\n\n              <sc-if value=\"{{ viewer.isVideo }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"washed\" style=\"aspect-ratio:16/9;border-radius:var(--radius-md);background:repeating-linear-gradient(135deg,var(--color-neutral-200),var(--color-neutral-200) 11px,var(--color-neutral-300) 11px,var(--color-neutral-300) 22px);display:flex;align-items:center;justify-content:center;position:relative;\">\n                  <div style=\"width:58px;height:58px;border-radius:999px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;color:var(--color-bg);\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" stroke=\"none\"><polygon points=\"6 3 20 12 6 21 6 3\"><\u002Fpolygon><\u002Fsvg><\u002Fdiv>\n                  <div style=\"position:absolute;bottom:10px;left:12px;font-family:ui-monospace,monospace;font-size:10px;color:var(--color-neutral-700);\">video pembelajaran<\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"font-size:14px;line-height:1.6;margin:14px 0 0;opacity:0.85;\">Video menjelaskan konsep utama disertai ilustrasi dan contoh nyata sehari-hari untuk calon pengantin.<\u002Fp>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ viewer.isBaca }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-family:ui-monospace,monospace;font-size:11px;color:var(--color-neutral-600);margin-bottom:10px;\">± 8 menit membaca<\u002Fdiv>\n                <p style=\"font-size:14px;line-height:1.7;margin:0 0 12px;opacity:0.85;\">Masa prakonsepsi adalah periode penting sebelum kehamilan. Status gizi calon ibu dan ayah pada masa ini memengaruhi kesehatan kehamilan dan tumbuh kembang anak kelak.<\u002Fp>\n                <div style=\"height:9px;background:var(--color-neutral-200);border-radius:999px;margin-bottom:8px;\"><\u002Fdiv>\n                <div style=\"height:9px;background:var(--color-neutral-200);border-radius:999px;margin-bottom:8px;width:92%;\"><\u002Fdiv>\n                <div style=\"height:9px;background:var(--color-neutral-200);border-radius:999px;margin-bottom:8px;width:96%;\"><\u002Fdiv>\n                <div style=\"height:9px;background:var(--color-neutral-200);border-radius:999px;width:68%;\"><\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ viewer.isKuis }}\" hint-placeholder-val=\"{{ <div style=\"font-size:14.5px;line-height:1.6;color:var(--color-accent-2-100);max-width:600px;\">Pilih seberapa sering Kakak/Abang mengonsumsi tiap bahan pangan dalam <strong style=\"color:var(--color-bg);\">1 bulan terakhir<\u002Fstrong>. Ada {{ ffqTotal }} bahan pangan di 9 kelompok — meski sesekali, tetap dipilih.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isPost }}\" hint-placeholder-val=\"{{ false }}\">\n            <h1 style=\"font-size:28px;line-height:1.15;margin:12px 0 8px;color:var(--color-bg);\">Kebiasaan makanmu kini — apa yang berubah? 🍽️<\u002Fh1>\n            <div style=\"font-size:14.5px;line-height:1.6;color:var(--color-accent-2-100);max-width:600px;\">Isi lagi seperti di Minggu 0: seberapa sering tiap bahan pangan dalam <strong style=\"color:var(--color-bg);\">1 bulan terakhir<\u002Fstrong>. {{ ffqTotal }} bahan pangan — kita bandingkan dengan awal program.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;align-items:flex-start;background:var(--color-accent-100);border-left:5px solid var(--color-accent);border-radius:var(--radius-md);padding:15px 18px;margin-bottom:14px;\">\n          <span style=\"font-size:22px;flex:0 0 auto;line-height:1.2;\">📅<\u002Fspan>\n          <div style=\"font-size:15px;line-height:1.55;color:var(--color-text);\">Dalam <strong style=\"color:var(--color-accent-800);text-transform:uppercase;\">satu bulan terakhir<\u002Fstrong>, seberapa sering kamu mengonsumsi <strong style=\"color:var(--color-accent-800);\">setiap jenis bahan pangan<\u002Fstrong> berikut?<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:sticky;top:0;z-index:5;background:var(--color-bg);padding:10px 0 12px;margin-bottom:8px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;\">\n            <span style=\"font-size:13px;font-weight:600;color:var(--color-accent-2-800);\">Terisi {{ ff      <button sc-camel-on-click=\"{{ submitFfq }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:24px;\">Kirim kebiasaan makan<\u002Fbutton>\n        <div style=\"font-size:12.5px;opacity:0.6;text-align:center;margin-top:10px;\">Usahakan semua {{ ffqTotal }} bahan pangan terisi sebelum mengirim.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= IPAQ AKTIVITAS FISIK ================= -->\n    <sc-if value=\"{{ isIpaq }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"animation:floatIn .4s ease both;max-width:760px;\">\n      <button sc-camel-on-click=\"{{ backToTahapWeek }}\" class=\"btn btn-ghost\" style=\"margin-bottom:16px;\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 19-7-7 7-7\"><\u002Fpath><path d=\"M19 12H5\"><\u002Fpath><\u002Fsvg>\n        Kembali ke {{ tWeek }}\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ ipaqSaved }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card elev-md\" style=\"padding:0;overflow:hidden;\">\n          <div style=\"background:var(--color-accent-2-900);color:var(--color-accent-2-100);padding:28px 30px;text-align:center;\">\n            <div style=\"width:56px;height:56px;border-radius:999px;background:rgba(255,255,255,0.16);color:var(--color-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <h2 style=\"font-size:23px;margin:0;color:var(--color-bg);\">Aktivitas fisikmu sudah terekam 🎉<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"padding:26px 30px;\">\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;\">\n              <div style=\"flex:1;min-width:150px;background:var(--color-neutral-100);border-radius:var(--radius-md);padding:16px 18px;text-align:center;\">\n                <div style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-text);line-height:1;\">{{ ipMet }}<\u002Fdiv>\n                <div style=\"font-size:12px;opacity:0.7;margin-top:6px;\">MET-menit / minggu<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:150px;background:{{ ipKatBg }};border-radius:var(--radius-md);padding:16px 18px;text-align:center;\">\n                <div style=\"font-family:var(--font-heading);font-size:20px;color:{{ ipKatColor }};line-height:1.15;\">{{ ipKatLabel }}<\u002Fdiv>\n                <div style=\"font-size:12px;opacity:0.7;margin-top:6px;\">Kategori aktivitas fisik<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.65;opacity:0.9;background:{{ ipKatBg }};border-radius:var(--radius-md);padding:14px 18px;\">{{ ipKatMsg }}<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.6;opacity:0.7;margin-top:14px;\">Waktu duduk pada hari kerja: <strong>±{{ ipDudukJam }} jam/hari<\u002Fstrong>. Semakin sedikit waktu duduk berlama-lama, semakin baik untuk kesehatanmu.<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.6;opacity:0.7;margin-top:8px;\">Aktivitas sedang + berat: <strong>{{ ipMvpa }} menit/minggu<\u002Fstrong> — anjuran WHO minimal 150 menit per minggu. <strong>{{ ipWhoLabel }}<\u002Fstrong><\u002Fdiv>\n            <div style=\"font-size:12px;opacity:0.55;margin-top:12px;\">MET (Metabolic Equivalent) mengukur total energi aktivitasmu seminggu — dihitung dari kombinasi aktivitas berat, sedang, dan jalan kaki. Batas kategori mengikuti panduan resmi IPAQ: <em>Tinggi<\u002Fem> = aktivitas berat ≥3 hari dengan total ≥1500 MET-menit, atau 7 hari aktivitas apa pun dengan total ≥3000 MET-menit. <em>Sedang<\u002Fem> = aktivitas berat ≥3 hari (≥20 menit/hari), atau aktivitas sedang/jalan ≥5 hari (≥30 menit/hari), atau ≥5 hari kombinasi dengan total ≥600 MET-menit. Selain itu <em>Rendah<\u002Fem>.<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;opacity:0.8;margin:16px 0 0;\">{{ tSavedMsg }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ backToTahapWeek }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:18px;\">Lanjut ke aktivitas {{ tWeek }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ ipaqNotSaved }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"elev-md\" style=\"background:var(--color-accent-2-900);color:var(--color-accent-2-100);border-radius:calc(var(--radius-lg) * 1.15);padding:28px 30px;position:relative;overflow:hidden;margin-bottom:20px;\">\n          <div style=\"position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:999px;background:color-mix(in srgb, var(--color-bg) 12%, transparent);\"><\u002Fdiv>\n          <div style=\"position:relative;\">\n            <span class=\"tag\" style=\"background:rgba(255,255,255,0.18);color:var(--color-bg);\">🏃 Aktivitas Fisik · {{ tTahap }} {{ tWeek }}<\u002Fspan>\n            <sc-if value=\"{{ preMode }}\" hint-placeholder-val=\"{{ true }}\">\n            <h1 style=\"font-size:28px;line-height:1.15;margin:12px 0 8px;color:var(--color-bg);\">Aktivitas Fisik Seminggu Terakhir (IPAQ)<\u002Fh1>\n            <div style=\"font-size:14.5px;line-height:1.6;color:var(--color-accent-2-100);max-width:600px;\">Ingat-ingat aktivitasmu dalam <strong style=\"color:var(--color-bg);\">7 hari terakhir<\u002Fstrong>. Isi angka pada tiap kolom — kalau tidak ada, isi <strong style=\"color:var(--color-bg);\">0<\u002Fstrong>. Hanya hitung aktivitas yang berlangsung ≥ 10 menit.<\u002Fdiv>\n            <div style=\"font-size:12px;line-height:1.5;color:var(--color-accent-2-200);max-width:600px;margin-top:8px;opacity:0.85;\">Mengacu pada <em>International Physical Activity Questionnaire<\u002Fem> (IPAQ) versi singkat.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isPost }}\" hint-placeholder-val=\"{{ false }}\">\n            <h1 style=\"font-size:28px;line-height:1.15;margin:12px 0 8px;color:var(--color-bg);\">Aktivitas fisikmu kini — makin bergerak? 🏃<\u002Fh1>\n            <div style=\"font-size:14.5px;line-height:1.6;color:var(--color-accent-2-100);max-width:600px;\">Sama seperti Minggu 0: ingat aktivitasmu <strong style=\"color:var(--color-bg);\">7 hari terakhir<\u002Fstrong>. Kalau tidak ada, isi <strong style=\"color:var(--color-bg);\">0<\u002Fstrong>. Kita lihat perubahannya sejak awal program.<\u002Fdiv>\n            <div style=\"font-size:12px;line-height:1.5;color:var(--color-accent-2-200);max-width:600px;margin-top:8px;opacity:0.85;\">Mengacu pada <em>International Physical Activity Questionnaire<\u002Fem> (IPAQ) versi singkat.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:20px;\">\n          <sc-for list=\"{{ ipaqGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div class=\"card elev-sm\" style=\"padding:22px;border-left:5px solid {{ g.accent }};\">\n              <div style=\"display:flex;align-items:baseline;gap:10px;\">\n                <span class=\"tag tag-neutral\">Bagian {{ g.n }}/4<\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-size:19px;\">{{ g.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;font-weight:600;opacity:0.92;margin:8px 0 12px;\">{{ g.def }}<\u002Fdiv>\n              <details style=\"margin:0 0 16px;\">\n                <summary style=\"cursor:pointer;font-size:13px;font-weight:600;color:var(--color-accent-2-800);list-style:none;display:inline-flex;align-items:center;gap:6px;\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n                  Lihat contoh aktivitasnya\n                <\u002Fsummary>\n                <div style=\"font-size:13px;line-height:1.6;opacity:0.85;margin-top:8px;padding:10px 14px;background:var(--color-accent-2-100);border-radius:var(--radius-md);\">{{ g.examples }}<\u002Fdiv>\n              <\u002Fdetails>\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <sc-for list=\"{{ g.items }}\" as=\"q\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n                    <span style=\"flex:1;min-width:200px;font-size:14px;line-height:1.4;\">{{ q.cap }}<\u002Fspan>\n                    <div style=\"display:flex;align-items:center;gap:8px;\">\n                      <input class=\"input\" type=\"number\" min=\"{{ q.min }}\" max=\"{{ q.max }}\" value=\"{{ q.value }}\" sc-camel-on-input=\"{{ q.onInput }}\" placeholder=\"0\" style=\"width:96px;text-align:center;\">\n                      <span style=\"font-size:12.5px;opacity:0.6;width:78px;\">{{ q.unit }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ submitIpaq }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:24px;\">Kirim aktivitas fisik<\u002Fbutton>\n        <div style=\"font-size:12.5px;opacity:0.6;text-align:center;margin-top:10px;\">Kalau suatu aktivitas tidak dilakukan, cukup isi 0.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= RENCANA AKSI (M8) ================= -->\n    <sc-if value=\"{{ isRen t).\nconst SERVER = { ada:false, tgl:null };\nconst INTI_M0 = ['identitas','pengetahuan','sikap-hbm','kebiasaan-makan-ffq','aktivitas-ipaq'];\nconst STATUS_KEY = 'shining_status_server';\nfunction setServer(ada, tgl){ SERVER.ada=!!ada; SERVER.tgl=(tgl && !isNaN(tgl.getTime())) ? tgl : null; }\nfunction bacaStatusCache(hp){ try{ const c=JSON.parse(localStorage.getItem(STATUS_KEY)||'null'); if(c && c.hp && c.hp===normalHP(hp) && c.ada) setServer(true, c.tgl? new Date(c.tgl) : null); }catch(e){} }\nasync function statusSesi1(hp){\n  const k=normalHP(hp); if(!GSHEET_URL || !k) return null;\n  try{\n    const r = await fetch(GSHEET_URL+'?aksi=status&hp='+encodeURIComponent(k)+'&sesi=1&kelompok=intervensi');\n    const j = await r.json();\n    if(!j || j.ok===false) return null;\n    // \"Punya data M0\" = KELIMA kuesioner inti pre-test tercatat di server.\n    // (Daftar 'selesai' juga memuat log-kegiatan/persetujuan — itu belum berarti M0.)\n    const sel = Array.isArray(j.selesai) ? j.selesai : [];\n    const nInti = (j.m0_inti!=null && j.m0_inti!=='') ? (+j.m0_inti||0) : INTI_M0.filter(x=>sel.indexOf(x)>=0).length;\n    const tgl = j.m0_lengkap ? new Date(j.m0_lengkap) : null;   // dikirim Apps Script v6\n    return { ada: nInti>=INTI_M0.length, tgl: (tgl && !isNaN(tgl.getTime())) ? tgl : null };\n  }catch(e){ return null; }\n}\nasync function kelompokLain(hp){\n  const k=normalHP(hp); if(!GSHEET_URL || !k) return [];\n  try{\n    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;\n    const tm = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, 8000);\n    const r = await fetch(GSHEET_URL+'?aksi=status&hp='+encodeURIComponent(k)+'&sesi=1&kelompok=intervensi', ctl ? { signal: ctl.signal } : undefined);\n    clearTimeout(tm);\n    const j = await r.json();\n    return (j && Array.isArray(j.kelompok_lain)) ? j.kelompok_lain : [];\n  }catch(e){ return []; }\n}\nfunction aksesServer(){ return SERVER.ada && !tuntasWajib(bacaDone(), WEEKS[0]); }\n\n// ——— Jadwal mingguan TETAP (18 Okt 2026): materi terbuka sesuai tanggal, tidak bisa maju lebih cepat ———\n// M0 selalu; M1 setelah M0 tuntas; M2–M7 hari ke-7·(n−1) sejak M0 tuntas; M8 (post-test) hari ke-56 (setara kontrol).\nconst MULAI_KEY = 'shining_mulai_at';\nconst JEDA_HARI = 7;\nconst HARI_M8 = 56;\nfunction hariBuka(n){ return n>=8 ? HARI_M8 : JEDA_HARI*(n-1); }\nconst SITUS = 'https://shining.edukasi-catin.id';\nfunction bacaMulai(){ try{ const v=localStorage.getItem(MULAI_KEY); return v? new Date(v) : null; }catch(e){ return null; } }\nfunction tulisMulai(d){ try{ localStorage.setItem(MULAI_KEY, d.toISOString()); }catch(e){} }\n// Jadwal hanya sah bila kegiatan wajib M0 memang sudah tuntas — melindungi dari\n// kunci 'shining_mulai_at' sisa uji coba di peramban yang sama.\nfunction mulaiSah(){ const m=bacaMulai(); const lokal = (m && tuntasWajib(bacaDone(), WEEKS[0])) ? m : null;\n  const srv = SERVER.ada ? SERVER.tgl : null;\n  if(lokal && srv) return lokal<srv ? lokal : srv; return lokal || srv; }\nfunction jadwalMinggu(n){ const m=mulaiSah(); if(!m || n<1) return null; const d=new Date(m.getTime()); d.setHours(0,0,0,0); d.setDate(d.getDate()+hariBuka(n)); return d; }\nfunction m0Selesai(){ return tuntasWajib(bacaDone(), WEEKS[0]) || SERVER.ada; }\n// Satu-satunya penentu minggu terbuka. Tanggal tidak diketahui → M2–M8 tetap terkunci.\nfunction mingguBuka(n){ if(n<=0) return true; if(!m0Selesai()) return false; if(n===1) return true;\n  const j=jadwalMinggu(n); return !!j && selisihHari(j)<=0; }\nfunction mingguJadwal(){ let k=0; for(let n=1;n<=8;n++){ if(mingguBuka(n)) k=n; } return k; }\nfunction pesanKunci(n){ if(n===1) return 'Minggu 1 terbuka setelah semua kegiatan Minggu 0 selesai ya, Kak.';\n  const j=jadwalMinggu(n);\n  return 'Minggu '+n+(n===8?' (kuesioner akhir)':'')+' terbuka '+(j?('pada '+tglId(j)):'sesuai jadwal setelah Minggu 0 selesai')+'.\\n\\nMateri dibuka bertahap setiap 7 hari agar kebiasaan baru terbentuk perlahan. Sambil menunggu, Kakak/Abang boleh mengulang materi minggu yang sudah terbuka.'; }\nfunction selisihHari(d){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }\nfunction tglId(d){ try{ return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return d.toISOString().slice(0,10); } }\nfunction aktTampil(a){ return !((HIDE_VIDEO && a.t==='video') || a.hidden || a.t==='setuju'); }\nfunction progresMinggu(done, w){ const tampil=w.acts.filter(a=>aktTampil(a) && !a.opsional); if(!tampil.length) return 0; let n=0; w.acts.forEach((a,i)=>{ if(aktTampil(a) && !a.opsional && done[w.n+'-'+i]) n++; }); return Math.round(n/tampil.length*100); }\n// Tugas bersifat sukarela — tidak dihitung sebagai syarat membuka minggu berikutnya.\nfunction tuntasWajib(done, w){ let semua=true; w.acts.forEach((a,i)=>{ if(!aktTampil(a) || a.t==='tugas' || a.opsional) return; if(!done[w.n+'-'+i]) semua=false; }); return semua; }\nfunction bacaDone(){ try{ return JSON.parse(localStorage.getItem('shining_done_main')||'{}')||{}; }catch(e){ return {}; } }\n// Syarat sertifikat: seluruh kuesioner inti M0 (pre) DAN M8 (post) sudah terisi.\nfunction prePostLengkap(done){\n  const inti = (w)=> !w ? false : w.acts.every((a,i)=>{\n    if(!aktTampil(a) || (a.t!=='tes' && a.t!=='identitas')) return true;\n    return !!done[w.n+'-'+i];\n  });\n  return (inti(WEEKS.find(w=>w.n===0)) || SERVER.ada) && inti(WEEKS.find(w=>w.n===8));\n}\nconst SERT_PESAN = 'Sertifikat bisa dicetak setelah seluruh kuesioner awal (Minggu 0) dan kuesioner akhir (Minggu 8) terisi lengkap ya, Kak.';\nfunction mingguKini(){ const d=bacaDone(); const awal = aksesServer() ? 1 : 0; for(let i=awal;i<WEEKS.length;i++){ if(progresMinggu(d, WEEKS[i])<100) return Math.min(WEEKS[i].n, Math.max(awal, mingguJadwal())); } return Math.max(awal, mingguJadwal()); }\n\nconst ARSIP_KEYS = ['shining_done_main', MULAI_KEY, 'shining_ffq_draft_pre-test', 'shining_ffq_draft_post-test', STATUS_KEY];\nfunction arsipkanPeserta(id){ const k=normalHP(id)||String(id||'').trim().toLowerCase(); if(!k) return;\n  try{ const box={}; ARSIP_KEYS.forEach(n=>{ const v=localStorage.getItem(n); if(v!=null) box[n]=v; localStorage.removeItem(n); });\n    if(Object.keys(box).length) localStorage.setItem('shining_arsip_'+k, JSON.stringify(box)); }catch(e){} }\nfunction pulihkanArsip(id){ const k=normalHP(id)||String(id||'').trim().toLowerCase(); if(!k) return null;\n  try{ const raw=localStorage.getItem('shining_arsip_'+k); if(!raw) return null; const box=JSON.parse(raw)||{};\n    Object.keys(box).forEach(n=>localStorage.setItem(n, box[n])); localStorage.removeItem('shining_arsip_'+k);\n    return JSON.parse(box['shining_done_main']||'{}')||{}; }catch(e){ return null; } }\n\nasync function sendToSheet(rec){\n  if(!GSHEET_URL) return;\n  let sess={}; try{ sess=JSON.parse(localStorage.getItem('shining_session')||'{}'); }catch(e){}\n  const now=new Date();\n  const hp = rec.no_hp || sess.hp || '';\n  const pilih = rec.asal_pendaftaran || sess.origin || '';\n  const out = Object.assign({ kelompok:'intervensi' }, rec, {\n    no_hp: hp, hp_kunci: normalHP(hp),\n    asal_pilih: pilih, asal_link: ASAL_LINK,\n    asal_cocok: ASAL_LINK ? (ASAL_LINK===pilih ? 'ya' : 'tidak') : 'tanpa-parameter',\n    rencana_menikah: rec.rencana_menikah || sess.rencana || '',\n    waktu_mulai: ACT_START.toISOString(), waktu_kirim: now.toISOString(),\n    durasi_menit: Math.round((now-ACT_START)/6000)/10,\n    tanggal_mulai: (()=>{ const m=mulaiSah(); return m? m.toISOString().slice(0,10) : ''; })(),\n    minggu_berjalan: mingguKini(),\n    jadwal_minggu_berikutnya: (()=>{ const j=jadwalMinggu(Math.max(1, mingguKini())); return j? j.toISOString().slice(0,10) : ''; })()\n  }, aksesServer() ? { akses_lintas_perangkat:'ya' } : {});\n  await fetch(GSHEET_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(out) });\n}\n\n// Sembunyikan aktivitas video untuk sementara (ubah ke false untuk menampilkan lagi).\nconst HIDE_VIDEO = true;\n\nclass Component extends DCLogic {\n  state = { authed:false, formCode:'', formName:'', origin:'BPPKB/BKKBN', view:'dashboard', selectedWeek:3, selectedActivity:null, layout:null, doneActs:{},\n    consent:{ kesediaan:false, informedConsent:false, komitmen:false },\n    form:{ nama:'', usia:'', gender:'Calon istri', didik:'', kerja:'', hp:'', tgl:'', bb:'', tb:'', lila:'', hb:'' },\n    saved:false, quizAns:{}, quizSaved:false, hbmAns:{}, hbmSaved:false, ffqAns:{}, ffqSaved:false, ipaqAns:{}, ipaqSaved:false, aksesAns:{}, aksesSaved:false, mitosAns:{}, refleksiText:'', refleksiSaved:false, imtCalcBB:'', imtCalcTB:'', imtShow:false, rencana:{ imt:'', pola:{}, akt:'', menit:'', periksa:{}, tgl:'', dukungan:'' }, rencanaSaved:false, tahap:'pre-test' };\n\n  backToTahapWeek = () => this.setState(s=>({ view:'week', selectedWeek: s.tahap==='post-test'?8:0, selectedActivity:null }));\n\n  openIpaq = (tahap='pre-test') => this.setState({ view:'ipaq', ipaqSaved:false, tahap });\n  openMitos = () => this.setState({ view:'mitos' });\n  pickMitos = (id, val) => this.setState(s=>{ const m={...s.mitosAns, [id]:val}; try{ const items=(window.QUIZ_MITOS&&window.QUIZ_MITOS.items)||[]; if(items.length && items.every(it=>m[it.id]) && !s.mitosSent){ let benar=0; items.forEach(it=>{ if(m[it.id]===it.key) benar++; }); this.logKegiatan('Mitos atau Fakta?', 'selesai', { skor:benar, total:items.length, jawaban:m }); this.markActDone(); return { mitosAns:m, mitosSent:true }; } }catch(e){} return { mitosAns:m }; });\n  openImt = () => this.setState({ view:'imt', imtCalcBB:'', imtCalcTB:'', imtShow:false });\n  openRencana = () => this.setState({ view:'rencana', rencanaSaved:false });\n  toggleRen = (grp, val) => this.setState(s=>{ const g={...(s.rencana[grp]||{})}; g[val]=!g[val]; return { rencana:{...s.rencana, [grp]:g} }; });\n  setRen = (k) => (e) => this.setState(s=>({ rencana:{...s.rencana, [k]:e.target.value} }));\n  submitRencana = async () => {\n    const r=this.state.rencana;\n    const pick=o=>Object.keys(o||{}).filter(k=>o[k]);\n    const rec = { kode_kelas:'SHINING-'+((({'BPPKB/BKKBN':'BKKBN','KUA':'KUA','Mandiri':'MANDIRI','Lainnya':'UMUM'})[this.state.origin])||'UMUM')+'-2026',\n      instrumen:'rencana-aksi', asal_pendaftaran:this.state.origin, nama:this.state.form.nama||this.state.formName,\n      target_imt:r.imt||'', pola_makan:pick(r.pola).join(', '), aktivitas:r.akt||'', menit_minggu:r.menit||'',\n      pemeriksaan:pick(r.periksa).join(', '), target_menjelang:pick(r.target).join(', '), dukungan:r.dukungan||'', created_at:new Date().toISOString() };\n    try { await sendToSheet(rec); } catch(e){}\n    try {\n      if (SUPA_URL && SUPA_KEY) {\n        await fetch(SUPA_URL+'/rest/v1/rencana_aksi', { method:'POST',\n          headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return-minimal'},\n          body:JSON.stringify(rec) });\n      } else {\n        const prev = JSON.parse(localStorage.getItem('shining_rencana_aksi')||'[]'); prev.push(rec);\n        localStorage.setItem('shining_rencana_aksi', JSON.stringify(prev));\n      }\n    } catch(e){}\n    this.setState({ rencanaSaved:true }); window.scrollTo({top:0});\n  };\n  setImtBB = (e) => this.setState({ imtCalcBB:e.target.value });\n  setImtTB = (e) => this.setState({ imtCalcTB:e.target.value });\n  calcImt = () => { this.logKegiatan('Kalkulator IMT', 'menghitung', { bb:this.state.imtCalcBB||'', tb:this.state.imtCalcTB||'' }); this.setState({ imtShow:true }); };\n  setRefleksi = (e) => this.setState({ refleksiText:e.target.value });\n  saveRefleksi = () => { this.markActDone(); try{ localStorage.setItem('shining_refleksi_motivasi', this.state.refleksiText||''); }catch(e){} try{ sendToSheet({ instrumen:'motivasi-menikah', kode_kelas:'SHINING-'+((({'BPPKB/BKKBN':'BKKBN','KUA':'KUA','Mandiri':'MANDIRI','Lainnya':'UMUM'})[this.state.origin])||'UMUM')+'-2026', asal_penda
